
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TCL Cassette | 7-Speed Wind</title>

<style>
:root {
    --navy: #17345f;
    --blue-gray: #637b98;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #eef6ff 100%
    );
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 20px;
}

.logo {
    width: 90px;
    margin-bottom: 8px;
}

h1 {
    color: var(--navy);
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 25px;
}

.video-title {
    color: var(--blue-gray);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
}

.video-box {
    width: 90vw;
    max-width: 850px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #081423;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* 独立预览图层 */
.preview-button {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: #081423;
    cursor: pointer;
}

.preview-button img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.play-icon {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(23, 52, 95, 0.88);
    color: #fff;
    font-size: 31px;
    line-height: 1;
    padding-left: 4px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
}

.preview-button[hidden],
.video-message[hidden] {
    display: none;
}

.video-message {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    background: rgba(8, 20, 35, .9);
    color: #fff;
    font-size: 15px;
    text-align: center;
}

.video-message a {
    color: #afd8ff;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .logo {
        width: 75px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 20px;
    }

    .video-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .play-icon {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        class="logo"
        src="../brand-logo.png"
        alt="TCL Logo"
    >

    <h1>TCL Cassette</h1>

    <div class="video-title">
        7-Speed Wind
    </div>

    <div class="video-box">

        <video
            id="trainingVideo"
            controls
            preload="auto"
            playsinline
            webkit-playsinline
        >
            <source
                src="7speed1.mp4"
                type="video/mp4"
            >
            Your browser does not support HTML video.
        </video>

        <!-- 预览图，点击后隐藏并启动视频 -->
        <button
            class="preview-button"
            id="previewButton"
            type="button"
            aria-label="Play 7-Speed Wind video"
        >
            <img
                src="preview.jpg"
                alt="7-Speed Wind video preview"
            >
            <span class="play-icon" aria-hidden="true">
                &#9654;
            </span>
        </button>

        <!-- 视频加载状态和错误提示 -->
        <div
            class="video-message"
            id="videoMessage"
            role="status"
            aria-live="polite"
            hidden
        >
            <span id="messageText">
                Loading video...
            </span>

            <a
                id="directVideoLink"
                href="7speed1.mp4"
                target="_blank"
                rel="noopener"
                hidden
            >
                Open MP4 directly
            </a>
        </div>

    </div>

</div>

<script>
(function () {

    const video = document.getElementById('trainingVideo');
    const button = document.getElementById('previewButton');
    const message = document.getElementById('videoMessage');
    const messageText = document.getElementById('messageText');
    const directLink = document.getElementById('directVideoLink');

    function setLoading() {
        messageText.textContent = 'Loading video...';
        directLink.hidden = true;
        message.hidden = false;
    }

    function showError(detail) {
        messageText.textContent =
            detail || 'Video failed to load.';
        directLink.hidden = false;
        message.hidden = false;
    }

    button.addEventListener('click', function () {

        // 立即隐藏封面
        button.hidden = true;

        // 显示加载提示
        setLoading();

        if (video.error) {
            showError(
                'Video cannot be loaded. Check 7speed1.mp4.'
            );
            return;
        }

        // 在用户点击事件中直接播放 MP4
        const playRequest = video.play();

        if (
            playRequest &&
            typeof playRequest.catch === 'function'
        ) {
            playRequest.catch(function (error) {
                showError(
                    'Playback could not start: ' +
                    (error.message || error.name)
                );
            });
        }
    });

    // 真正开始播放后隐藏加载提示
    video.addEventListener('playing', function () {
        message.hidden = true;
    });

    // 视频加载失败
    video.addEventListener('error', function () {
        if (button.hidden) {
            showError(
                'Video failed to load. Check the filename, network, or MP4 format.'
            );
        }
    });

})();
</script>

</body>
</html>
